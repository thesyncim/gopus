name: tmp-kernel-safety

on:
  push:
    branches:
      - ci/tmp-kernel-safety-check

permissions:
  contents: read

env:
  GOWORK: "off"
  LIBOPUS_VERSION: "1.6.1"

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        mode: [unpaired, paired]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build default libopus tree
        run: make ensure-libopus
      - name: v3 celt and silk packages (${{ matrix.mode }})
        run: |
          set +e
          if [ "${{ matrix.mode }}" = paired ]; then
            export GOPUS_LIBOPUS_AMD64_TARGET=v3
          fi
          export GOAMD64=v3
          go test ./internal/celt ./internal/silk -count=1 -timeout 60m 2>&1 | grep -E '^(--- FAIL|FAIL|ok|panic)|^    --- FAIL|_test.go:[0-9]+:' | cut -c1-240 | head -150
          echo "exit status of pipeline: ${PIPESTATUS[0]}"
