name: tmp-kernel-safety

on:
  push:
    branches:
      - ci/tmp-kernel-safety-check

permissions:
  contents: read

env:
  GOWORK: "off"
  LIBOPUS_VERSION: "1.6.1"

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make ensure-libopus
      - name: residual failures in detail
        run: |
          set +e
          C='^(TestConcealPeriodicPLCMatchesLibopus|TestCombFilterInPlaceMatchesReference|TestNoiseFloorMatchesLibopusFloat|TestTripleInnerProdMatchesSeparateCeltInnerProd)$'
          S='^(TestSILKFindLTPFLPMatchesLibopusOracle|TestSILKCorrelationMatrixVectorMatchesLibopusOracle)$'
          for mode in "v1:" "v3:v3"; do
            lvl="${mode%%:*}"; tgt="${mode##*:}"
            echo "######## GOAMD64=$lvl target=$tgt"
            GOAMD64=$lvl GOPUS_LIBOPUS_AMD64_TARGET=$tgt go test ./internal/celt -run "$C" -count=1 -v 2>&1 | grep -vE '^=== (RUN|PAUSE|CONT)' | cut -c1-260 | head -40
            GOAMD64=$lvl GOPUS_LIBOPUS_AMD64_TARGET=$tgt go test ./internal/silk -run "$S" -count=1 -v 2>&1 | grep -vE '^=== (RUN|PAUSE|CONT)' | cut -c1-260 | head -30
          done
