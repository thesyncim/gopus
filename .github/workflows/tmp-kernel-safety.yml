name: tmp-kernel-safety

on:
  push:
    branches:
      - ci/tmp-kernel-safety-check

permissions:
  contents: read

env:
  GOWORK: "off"
  LIBOPUS_VERSION: "1.6.1"

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: CPU
        run: lscpu | grep -E 'Model name|Flags' | head -3 | cut -c1-400
      - name: Kernel safety matrix
        run: make test-kernel-safety
      - name: Haar stride test per lane (verbose)
        if: always()
        run: |
          set +e
          go test ./internal/celt -run '^TestHaar1' -count=1 -v 2>&1 | grep -E '^(--- |ok|FAIL|PASS)|SKIP' | head -30
          echo "---- v1"
          GOAMD64=v1 go test ./internal/celt -run '^TestHaar1' -count=1 -v 2>&1 | grep -E '^(--- |ok|FAIL|PASS)|SKIP' | head -30
          echo "---- v3 paired"
          GOAMD64=v3 GOPUS_LIBOPUS_AMD64_TARGET=v3 go test ./internal/celt -run '^TestHaar1' -count=1 -v 2>&1 | grep -E '^(--- |ok|FAIL|PASS)|SKIP' | head -30
          echo "---- v3 baseline"
          GOAMD64=v3 go test ./internal/celt -run '^TestHaar1' -count=1 -v 2>&1 | grep -E '^(--- |ok|FAIL|PASS|\s+haar1)|SKIP' | head -30
