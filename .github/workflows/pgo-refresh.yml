name: PGO refresh

# default.pgo is a sample-based (non-deterministic) profile, so it cannot be
# diff-checked in regular CI. It is also amd64-specific: the hot kernels it
# profiles are the AVX2/SSE2 paths, so it must be regenerated on amd64, never on
# an arm64 dev box. This manual job refreshes it on an amd64 runner and either
# opens a pull request or uploads the result for an existing branch.
on:
  workflow_dispatch:
    inputs:
      delivery:
        description: Publish a new PR or an artifact for an existing PR
        type: choice
        default: pull-request
        options:
          - pull-request
          - artifact

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: refresh-default-pgo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate scalar and SIMD profiles on native amd64
        run: python3 scripts/refresh_pgo.py "$RUNNER_TEMP/pgo-refresh"

      - name: Upload profile and training provenance
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pgo-refresh-${{ github.sha }}
          path: ${{ runner.temp }}/pgo-refresh
          if-no-files-found: error
          retention-days: 30

      - name: Install refreshed profile
        run: cp "$RUNNER_TEMP/pgo-refresh/default.pgo" default.pgo

      - name: Open a refresh pull request
        if: inputs.delivery != 'artifact'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- default.pgo; then
            echo "default.pgo unchanged; nothing to do"
            exit 0
          fi
          branch="pgo-refresh-$(date -u +%Y%m%dT%H%M%SZ)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          cp "$RUNNER_TEMP/pgo-refresh/provenance.json" default.pgo.json
          git add default.pgo default.pgo.json
          git commit -m "build: refresh default.pgo (amd64 PGO profile)"
          git push origin "${branch}"
          gh pr create \
            --base master \
            --head "${branch}" \
            --title "build: refresh default.pgo (amd64)" \
            --body "Regenerated default.pgo from equal-duration scalar and SIMD training on native amd64 via the PGO refresh workflow. Profile hashes and source/compiler provenance are recorded in default.pgo.json. It is a sample-based, non-deterministic profile; review the bench guardrail impact (make bench-libopus-guard) before merging."
